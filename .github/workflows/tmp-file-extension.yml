name: Временная реализация расширения PhoenixFS

on:
  push:
    branches:
      - feature/phoenix-fs-file-extension

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: Применить изменения
        run: python .github/tmp_file_extension.py
      - name: Форматировать код
        run: cargo fmt --all
      - name: Проверить форматирование
        run: cargo fmt --all -- --check
      - name: Проверить PhoenixFS
        run: cargo test -p phoenix-fs
      - name: Проверить ВФС
        run: cargo test -p phoenix-vfs
      - name: Подготовить итоговый коммит
        run: |
          rm .github/tmp_file_extension.py .github/workflows/tmp-file-extension.yml
          rm -f Cargo.lock
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/phoenix-fs/src/lib.rs ROADMAP.md STATUS.md .github
          git commit -m 'Добавить расширение файлов PhoenixFS'
          git push origin HEAD:feature/phoenix-fs-file-extension
