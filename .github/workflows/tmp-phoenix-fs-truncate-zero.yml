name: Временная проверка усечения PhoenixFS

on:
  push:
    branches:
      - feature/phoenix-fs-truncate-zero

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/phoenix-fs-truncate-zero
          fetch-depth: 0

      - name: Применить изменение
        run: python3 .github/tmp_phoenix_fs_truncate_zero.py

      - name: Привести код к формату
        run: cargo fmt --all

      - name: Проверить форматирование
        run: cargo fmt --all -- --check

      - name: Проверить PhoenixFS
        run: cargo test -p phoenix-fs

      - name: Проверить ВФС
        run: cargo test -p phoenix-vfs

      - name: Зафиксировать результат
        shell: bash
        run: |
          rm -f .github/tmp_phoenix_fs_truncate_zero.py .github/workflows/tmp-phoenix-fs-truncate-zero.yml Cargo.lock
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/phoenix-fs/src/lib.rs ROADMAP.md STATUS.md .github
          git diff --cached --quiet && exit 0
          git commit -m 'Добавить атомарное усечение файла PhoenixFS до нуля'
          git push origin HEAD:feature/phoenix-fs-truncate-zero
