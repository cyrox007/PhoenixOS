name: Временная реализация диапазонного возврата PhoenixFS
on:
  push:
    branches:
      - feature/phoenix-fs-retired-extents
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: Применить изменения
        run: python .github/tmp_retired_extents.py
      - name: Форматировать код
        run: cargo fmt --all
      - name: Проверить форматирование
        run: cargo fmt --all -- --check
      - name: Проверить PhoenixFS
        run: cargo test -p phoenix-fs
      - name: Проверить ВФС
        run: cargo test -p phoenix-vfs
      - name: Подготовить итоговый коммит
        run: |
          rm .github/tmp_retired_extents.py .github/workflows/tmp-retired-extents.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/phoenix-fs/src/lib.rs ROADMAP.md STATUS.md .github
          git commit -m 'Перевести возврат блоков PhoenixFS на диапазоны'
          git push origin HEAD:feature/phoenix-fs-retired-extents
