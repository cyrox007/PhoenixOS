[package]
name = "kernel"
version = "0.0.1"
edition = "2024"
publish = false

[dependencies]
bootloader_api = "=0.11.17"
lazy_static = { version = "1.5.0", features = ["spin_no_std"] }
linked_list_allocator = "=0.10.6"
phoenix-acpi = { path = "../crates/acpi" }
phoenix-capability = { path = "../crates/capability-model" }
phoenix-elf-loader = { path = "../crates/elf-loader" }
phoenix-framebuffer = { path = "../crates/phoenix-framebuffer" }
phoenix-ipc = { path = "../crates/ipc-model" }
phoenix-memory = { path = "../crates/boot-memory" }
phoenix-pcie = { path = "../crates/pcie" }
phoenix-process = { path = "../crates/process-model" }
phoenix-process-manager = { path = "../crates/process-manager" }
phoenix-scheduler = { path = "../crates/scheduler" }
phoenix-service-manager = { path = "../crates/service-manager" }
phoenix-syscall-abi = { path = "../crates/syscall-abi" }
phoenix-vfs = { path = "../crates/vfs" }
phoenix-vm = { path = "../crates/virtual-memory" }
uart_16550 = "0.8.0"
x86_64 = "0.15.2"

[build-dependencies]
userspace-smoke = { package = "phoenix-userspace-smoke", path = "../userspace/smoke", artifact = "bin", target = "x86_64-unknown-none" }

