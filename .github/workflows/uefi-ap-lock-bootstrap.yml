name: Временное закрепление зависимостей UEFI

on:
  push:
    branches:
      - feat/342-uefi-ap-msr-probe
    paths:
      - .github/workflows/uefi-ap-lock-bootstrap.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Подготовить версию Rust из проекта
        run: rustup show
      - name: Закрепить зависимости предзагрузочной утилиты
        run: cargo generate-lockfile --manifest-path tools/uefi-ap-probe/Cargo.toml
      - name: Зафиксировать Cargo.lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/uefi-ap-probe/Cargo.lock
          git commit -m "Зафиксировать версии зависимостей предзагрузочной диагностики UEFI"
          git push origin HEAD:feat/342-uefi-ap-msr-probe
