name: Временная проверка контрольных сумм PhoenixFS

on:
  push:
    branches:
      - feature/phoenix-fs-data-checksums

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/phoenix-fs-data-checksums
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@nightly

      - name: Применить реализацию
        run: python3 .github/tmp_data_checksums.py

      - name: Удалить временные файлы
        run: |
          rm .github/tmp_data_checksums.py
          rm .github/workflows/tmp-data-checksums.yml

      - name: Форматировать код
        run: cargo fmt --all

      - name: Проверить форматирование
        run: cargo fmt --all -- --check

      - name: Проверить PhoenixFS
        run: cargo test -p phoenix-fs

      - name: Проверить ВФС
        run: cargo test -p phoenix-vfs

      - name: Удалить служебный Cargo.lock
        run: rm -f Cargo.lock

      - name: Подготовить итоговый коммит
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Добавить контрольные суммы данных PhoenixFS"
          git push origin HEAD:feature/phoenix-fs-data-checksums
