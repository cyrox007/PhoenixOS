name: Временное исправление форматирования AMD IOMMU

on:
  push:
    branches: [feat/342-amd-iommu-hardware-engine]
    paths:
      - .github/workflows/temp-format-amd.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/342-amd-iommu-hardware-engine
      - run: rustup show
      # Запуск после исправления синтаксиса проверки памяти
      - name: Единое форматирование кода Rust
        run: cargo fmt --all
      - name: Зафиксировать оформление
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/dma/src/amd_iommu_v1.rs dma-test-kernel/src/amd_iommu_test.rs dma-test-kernel/src/main.rs
          if ! git diff --cached --quiet; then
            git commit -m "Согласовать форматирование AMD IOMMU и испытательного ядра"
            git push origin HEAD:feat/342-amd-iommu-hardware-engine
          fi
