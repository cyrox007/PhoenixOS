name: Исправление одноразового скрипта internal merge

on:
  push:
    branches:
      - feature/phoenix-fs-internal-merge-v1

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/phoenix-fs-internal-merge-v1
      - name: Исправить поиск точки вставки
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/implement-internal-merge.yml')
          s = path.read_text()
          old = """          hook_anchor = '''    if anchor_position == 0 && anchor.item_count == 2 {'''
          hook_end = '''    let requested_blocks =
              u64::try_from(anchor_position + 2).map_err(|_| PhoenixFsError::ArithmeticOverflow)?;'''
          if hook_end not in s:
              raise SystemExit('hook end not found')
"""
          new = """          hook_marker = '    let requested_blocks ='
          function_start = s.index(anchor)
          hook_position = s.index(hook_marker, function_start)
"""
          if old not in s:
              raise SystemExit('старый фрагмент не найден')
          s = s.replace(old, new, 1)
          old_insert = """          if hook.strip() not in s:
              s = s.replace(hook_end, hook + hook_end, 1)
"""
          new_insert = """          if hook.strip() not in s:
              s = s[:hook_position] + hook + s[hook_position:]
"""
          if old_insert not in s:
              raise SystemExit('старый фрагмент вставки не найден')
          s = s.replace(old_insert, new_insert, 1)
          path.write_text(s)
          PY
      - name: Зафиксировать исправление
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/implement-internal-merge.yml
          git commit -m "Исправить одноразовый скрипт internal merge"
          git push origin HEAD:feature/phoenix-fs-internal-merge-v1
