name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Установить QEMU и OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf

      - name: Выбрать инструментарий Rust
        run: rustup show

      - name: Проверить форматирование
        run: cargo fmt --all -- --check

      - name: Проверить реестр загрузочных маркеров
        run: bash scripts/test-check-serial-markers.sh

      - name: Запустить модульные проверки ядра
        run: |
          cargo test -p phoenix-framebuffer
          cargo test -p phoenix-memory
          cargo test -p phoenix-vm
          cargo test -p phoenix-scheduler
          cargo test -p phoenix-process
          cargo test -p phoenix-syscall-abi
          cargo test -p phoenix-capability
          cargo test -p phoenix-ipc
          cargo test -p phoenix-elf-loader
          cargo test -p phoenix-user-runtime

      - name: Собрать UEFI-образ
        run: |
          mkdir -p artifacts
          IMAGE="$(cargo run --release --quiet)"
          test -f "$IMAGE"
          cp "$IMAGE" artifacts/phoenixos-uefi.img

      - name: Проверить ядро в QEMU
        env:
          PHOENIXOS_MARKERS_FILE: tests/qemu/bootstrap.markers
        run: bash scripts/run-qemu-ci.sh artifacts/phoenixos-uefi.img

      - name: Сохранить UEFI-образ
        uses: actions/upload-artifact@v4
        with:
          name: phoenixos-uefi
          path: artifacts/phoenixos-uefi.img
          if-no-files-found: error
