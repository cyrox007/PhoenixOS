name: Одноразовая фиксация версий зависимостей

on:
  push:
    branches:
      - fix/342-cr3-concurrency-reproducible
    paths:
      - .github/workflows/lockfile-bootstrap.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Подготовить закреплённый Rust
        run: rustup show
      - name: Сформировать точный перечень зависимостей
        run: cargo generate-lockfile
      - name: Зафиксировать Cargo.lock в рабочей ветке
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "Закрепить версии зависимостей Cargo"
          git push origin HEAD:fix/342-cr3-concurrency-reproducible
