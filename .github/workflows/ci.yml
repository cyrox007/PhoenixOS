name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Установить QEMU и OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf

      - name: Выбрать инструментарий Rust
        run: rustup show

      - name: Проверить форматирование
        run: cargo fmt --all -- --check

      - name: Запустить модульные проверки ядра
        run: |
          cargo test -p phoenix-framebuffer
          cargo test -p phoenix-memory
          cargo test -p phoenix-vm
          cargo test -p phoenix-scheduler

      - name: Собрать UEFI-образ
        run: |
          mkdir -p artifacts
          IMAGE="$(cargo run --release --quiet)"
          test -f "$IMAGE"
          cp "$IMAGE" artifacts/phoenixos-uefi.img

      - name: Проверить ядро в QEMU
        env:
          PHOENIXOS_EXPECT_SERIAL: "exception: breakpoint"
          PHOENIXOS_EXPECT_SERIAL_2: "virtual memory self-test: OK"
          PHOENIXOS_EXPECT_SERIAL_3: "kernel heap self-test: OK"
          PHOENIXOS_EXPECT_SERIAL_4: "apic timer self-test: OK"
        run: bash scripts/run-qemu-ci.sh artifacts/phoenixos-uefi.img

      - name: Сохранить UEFI-образ
        uses: actions/upload-artifact@v4
        with:
          name: phoenixos-uefi
          path: artifacts/phoenixos-uefi.img
          if-no-files-found: error
