[workspace]
resolver = "3"
members = [
    "kernel",
    "diagnostic-kernel",
    "dma-test-kernel",
    "tools/diagnostic-image",
    "tools/dma-test-image",
    "crates/acpi",
    "crates/phoenix-framebuffer",
    "crates/pcie",
    "crates/driver-registry",
    "drivers/reference-edu",
    "crates/dma",
    "crates/boot-memory",
    "crates/block-storage",
    "crates/virtual-memory",
    "crates/scheduler",
    "crates/shell",
    "crates/process-model",
    "crates/process-manager",
    "crates/service-manager",
    "crates/storage-policy",
    "crates/syscall-abi",
    "crates/capability-model",
    "crates/ipc-model",
    "crates/input-queue",
    "crates/diagnostic-journal",
    "crates/dma-acceptance",
    "crates/network",
    "crates/libc-compat",
    "crates/elf-loader",
    "crates/fat",
    "crates/phoenix-fs",
    "crates/user-runtime",
    "crates/vfs",
    "userspace/smoke",
    "userspace/input-probe",
    "userspace/shell",
]

[package]
name = "phoenixos"
version = "0.0.1"
edition = "2024"
publish = false

[build-dependencies]
kernel = { path = "kernel", artifact = "bin", target = "x86_64-unknown-none" }
bootloader = "=0.11.17"
