name: Выполнение internal merge PhoenixFS

on:
  push:
    branches:
      - feature/phoenix-fs-internal-merge-v1

permissions:
  contents: write

jobs:
  apply_and_test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/phoenix-fs-internal-merge-v1
      - name: Выполнить исправленный скрипт в памяти
        shell: bash
        run: |
          python3 - <<'PYFIX'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/implement-internal-merge.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(workflow) if "python3 - <<'PY'" in line) + 1
          end = next(i for i, line in enumerate(workflow[start:], start) if line.strip() == 'PY')
          script = textwrap.dedent('\n'.join(workflow[start:end]))

          old = """hook_anchor = '''    if anchor_position == 0 && anchor.item_count == 2 {'''
hook_end = '''    let requested_blocks =
    u64::try_from(anchor_position + 2).map_err(|_| PhoenixFsError::ArithmeticOverflow)?;'''
if hook_end not in s:
    raise SystemExit('hook end not found')
"""
          if old not in script:
              old = """hook_anchor = '''    if anchor_position == 0 && anchor.item_count == 2 {'''
hook_end = '''    let requested_blocks =
    u64::try_from(anchor_position + 2).map_err(|_| PhoenixFsError::ArithmeticOverflow)?;'''
if hook_end not in s:
    raise SystemExit('hook end not found')
"""

          # Не зависим от точного форматирования исходного Rust-кода.
          marker_start = script.index("hook_anchor =")
          marker_end = script.index("hook = r'''", marker_start)
          replacement = "hook_marker = '    let requested_blocks ='\nfunction_start = s.index(anchor)\nhook_position = s.index(hook_marker, function_start)\n"
          script = script[:marker_start] + replacement + script[marker_end:]
          script = script.replace(
              "s = s.replace(hook_end, hook + hook_end, 1)",
              "s = s[:hook_position] + hook + s[hook_position:]",
              1,
          )

          namespace = {'__name__': '__main__'}
          exec(compile(script, 'internal-merge-patch', 'exec'), namespace)
          PYFIX
      - name: Форматировать
        run: cargo fmt --all
      - name: Проверить PhoenixFS
        run: cargo test -p phoenix-fs
      - name: Зафиксировать рабочие изменения
        shell: bash
        run: |
          if git diff --quiet -- crates/phoenix-fs/src/lib.rs docs/phoenix-fs.md STATUS.md ROADMAP.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/phoenix-fs/src/lib.rs docs/phoenix-fs.md STATUS.md ROADMAP.md
          git commit -m "Добавить слияние внутренних узлов PhoenixFS"
          git push origin HEAD:feature/phoenix-fs-internal-merge-v1
