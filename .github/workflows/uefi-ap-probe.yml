name: Предзагрузочная проверка регистров всех процессоров UEFI

on:
  pull_request:
    paths:
      - tools/uefi-ap-probe/**
      - scripts/run-uefi-ap-probe.py
      - tests/platform/test-uefi-ap-probe.py
      - .github/workflows/uefi-ap-probe.yml
  push:
    branches: [develop]
    paths:
      - tools/uefi-ap-probe/**
      - scripts/run-uefi-ap-probe.py
      - tests/platform/test-uefi-ap-probe.py
      - .github/workflows/uefi-ap-probe.yml

permissions:
  contents: read

jobs:
  ap-measurement:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Установить проверочные средства
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf dosfstools mtools
          rustup target add x86_64-unknown-uefi
      - name: Проверить форматирование UEFI-утилиты
        run: cargo fmt --manifest-path tools/uefi-ap-probe/Cargo.toml --all -- --check
      - name: Проверить отсутствие небезопасных путей
        run: python3 tests/platform/test-uefi-ap-probe.py
      - name: Собрать строго закреплённые зависимости UEFI
        run: |
          cargo build --manifest-path tools/uefi-ap-probe/Cargo.toml --target x86_64-unknown-uefi --release --locked
      - name: Измерить четыре настоящих логических процессора QEMU
        run: |
          mkdir -p artifacts
          sudo python3 scripts/run-uefi-ap-probe.py tools/uefi-ap-probe/target/x86_64-unknown-uefi/release/phoenix-uefi-ap-probe.efi artifacts/uefi-ap-probe-serial.log
      - name: Сохранить журнал при ошибке
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-uefi-ap-probe-failure-log
          path: artifacts/uefi-ap-probe-serial.log
          if-no-files-found: ignore
      - name: Сохранить проверенный QEMU-образ
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-uefi-ap-probe-qemu-only
          path: |
            tools/uefi-ap-probe/target/x86_64-unknown-uefi/release/phoenix-uefi-ap-probe.efi
            artifacts/uefi-ap-probe-serial.log
