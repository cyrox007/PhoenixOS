name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Установить QEMU и OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf

      - name: Выбрать инструментарий Rust
        run: rustup show

      - name: Проверить только современную загрузку и контроллеры
        run: python3 tests/platform/test-modern-profile.py

      - name: Сверить результаты приёмки этапа 0.3
        run: python3 tests/platform/test-audit-0.3.py

      - name: Проверить пределы ожидания QEMU
        run: python3 tests/platform/test-qemu-watchdog.py

      - name: Проверить изоляцию диагностического образа
        run: python3 tests/platform/test-diagnostic-isolation.py

      - name: Проверить разбор аппаратного протокола
        run: python3 tests/platform/test-dma-evidence.py

      - name: Проверить изоляцию отдельного DMA-образа
        run: python3 tests/platform/test-dma-qemu-profile.py

      - name: Проверить сведения ASUS и совместимость PowerShell 5.1
        run: python3 tests/platform/test-asus-inventory.py

      - name: Проверить инвалидирование аппаратных доказательств
        run: python3 tests/platform/test-dma-mapping-coverage.py

      - name: Проверить точные идентификаторы процессоров
        run: python3 tests/platform/test-dma-topology.py

      - name: Проверить форматирование
        run: cargo fmt --all -- --check

      - name: Проверить реестр загрузочных маркеров
        run: bash scripts/test-check-serial-markers.sh

      - name: Проверить C-заголовки пользовательской среды
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Isdk/include -fsyntax-only tests/c/runtime_header.c
          cc -std=c11 -Wall -Wextra -Werror -Isdk/include -fsyntax-only tests/c/libc_header.c

      - name: Запустить модульные проверки ядра
        run: |
          cargo test --locked -p phoenix-diagnostic-journal
          cargo test --locked -p phoenix-network
          cargo test --locked -p phoenix-framebuffer
          cargo test --locked -p phoenix-memory
          cargo test --locked -p phoenix-pcie
          cargo test --locked -p phoenix-driver-registry
          cargo test --locked -p phoenix-reference-edu
          cargo test --locked -p phoenix-dma
          cargo test --locked -p phoenix-dma-acceptance
          cargo test --locked -p phoenix-acpi
          cargo test --locked -p phoenix-block
          cargo test --locked -p phoenix-vm
          cargo test --locked -p phoenix-scheduler
          cargo test --locked -p phoenix-shell
          cargo test --locked -p phoenix-process
          cargo test --locked -p phoenix-process-manager
          cargo test --locked -p phoenix-service-manager
          cargo test --locked -p phoenix-storage-policy
          cargo test --locked -p phoenix-syscall-abi
          cargo test --locked -p phoenix-capability
          cargo test --locked -p phoenix-ipc
          cargo test --locked -p phoenix-libc
          cargo test --locked -p phoenix-elf-loader
          cargo test --locked -p phoenix-fat
          cargo test --locked -p phoenix-fs
          cargo test --locked -p phoenix-user-runtime
          cargo test --locked -p phoenix-vfs

      - name: Собрать пользовательскую оболочку
        run: cargo build --locked -p phoenix-userspace-shell --target x86_64-unknown-none --release

      - name: Собрать UEFI-образ
        run: |
          mkdir -p artifacts
          IMAGE="$(cargo run --locked --release --quiet)"
          test -f "$IMAGE"
          cp "$IMAGE" artifacts/phoenixos-uefi.img

      - name: Проверить ядро в QEMU
        env:
          PHOENIXOS_MARKERS_FILE: tests/qemu/bootstrap.markers
          PHOENIXOS_QEMU_FAULT_LOG: artifacts/qemu-faults.log
        run: bash scripts/run-qemu-ci.sh artifacts/phoenixos-uefi.img

      - name: Вывести причины отказа запуска процессоров QEMU
        if: failure()
        run: |
          if test -f artifacts/qemu-faults.log; then
            grep -n -E "check_exception|Triple fault|v=0[0-9a-f]|CPU Reset|EIP=|RIP=" artifacts/qemu-faults.log | tail -n 120 || true
            tail -n 40 artifacts/qemu-faults.log
          fi
      - name: Сохранить журнал QEMU при ошибке
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phoenixos-qemu-diagnostics
          path: |
            artifacts/qemu-serial.log
            artifacts/qemu-faults.log
          if-no-files-found: warn

      - name: Собрать независимый диагностический образ UEFI
        run: |
          IMAGE="$(cargo run --locked -p phoenixos-diagnostic-image --release --quiet)"
          test -f "$IMAGE"
          cp "$IMAGE" artifacts/phoenixos-diagnostic-uefi.img

      - name: Проверить безопасный диагностический запуск QEMU
        run: sudo python3 scripts/run-diagnostic-qemu.py artifacts/phoenixos-diagnostic-uefi.img artifacts/diagnostic-serial.log

      - name: Сохранить диагностический журнал при ошибке
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phoenixos-diagnostic-error-log
          path: artifacts/diagnostic-serial.log
          if-no-files-found: warn

      - name: Сохранить диагностический образ
        uses: actions/upload-artifact@v4
        with:
          name: phoenixos-diagnostic-uefi
          path: artifacts/phoenixos-diagnostic-uefi.img
          if-no-files-found: error

      - name: Сохранить UEFI-образ
        uses: actions/upload-artifact@v4
        with:
          name: phoenixos-uefi
          path: artifacts/phoenixos-uefi.img
          if-no-files-found: error

      - name: Собрать отдельный образ реального DMA для QEMU
        run: |
          IMAGE="$(cargo run --locked -p phoenixos-dma-test-image --release --quiet)"
          test -f "$IMAGE"
          cp "$IMAGE" artifacts/phoenixos-dma-qemu-only-uefi.img

      - name: Проверить аппаратную передачу на виртуальном PCI EDU
        run: sudo python3 scripts/run-dma-test-qemu.py artifacts/phoenixos-dma-qemu-only-uefi.img artifacts/dma-qemu-serial.log

      - name: Сохранить журнал отдельного испытания DMA при ошибке
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phoenixos-dma-qemu-error-log
          path: artifacts/dma-qemu-serial.log
          if-no-files-found: warn

      - name: Сохранить отдельный испытательный образ DMA
        uses: actions/upload-artifact@v4
        with:
          name: phoenixos-dma-qemu-only-uefi
          path: artifacts/phoenixos-dma-qemu-only-uefi.img
          if-no-files-found: error
