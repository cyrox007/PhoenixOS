name: Временная проверка пользовательской среды

on:
  push:
    branches:
      - feature/userspace-runtime-smoke

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/userspace-runtime-smoke
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview

      - name: Применить интеграцию
        run: python3 .github/tmp_userspace_runtime.py

      - name: Удалить временные файлы
        run: |
          rm .github/tmp_userspace_runtime.py
          rm .github/workflows/tmp-userspace-runtime.yml

      - name: Форматировать код
        run: cargo fmt --all

      - name: Проверить форматирование
        run: cargo fmt --all -- --check

      - name: Собрать пользовательскую программу
        run: cargo build -p phoenix-userspace-smoke --target x86_64-unknown-none --release

      - name: Проверить библиотеку пользовательской среды
        run: cargo test -p phoenix-user-runtime

      - name: Проверить ELF-загрузчик
        run: cargo test -p phoenix-elf-loader

      - name: Собрать ядро с пользовательским ELF
        run: cargo build -p kernel --target x86_64-unknown-none

      - name: Удалить служебный Cargo.lock
        run: rm -f Cargo.lock

      - name: Подготовить итоговый коммит
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Завершить минимальную пользовательскую среду"
          git push origin HEAD:feature/userspace-runtime-smoke
