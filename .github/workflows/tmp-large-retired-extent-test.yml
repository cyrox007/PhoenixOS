name: Временная проверка большого освобождённого экстента
on:
  push:
    branches:
      - feature/phoenix-fs-retired-extents
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: Добавить проверку
        run: python .github/tmp_large_retired_extent_test.py
      - name: Форматировать код
        run: cargo fmt --all
      - name: Проверить форматирование
        run: cargo fmt --all -- --check
      - name: Проверить PhoenixFS
        run: cargo test -p phoenix-fs phoenix_vfs_rewrites_file_larger_than_retired_block_capacity -- --exact
      - name: Проверить весь PhoenixFS
        run: cargo test -p phoenix-fs
      - name: Подготовить итоговый коммит
        run: |
          rm .github/tmp_large_retired_extent_test.py .github/workflows/tmp-large-retired-extent-test.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/phoenix-fs/src/lib.rs .github
          git commit -m 'Проверить большие освобождённые экстенты PhoenixFS'
          git push origin HEAD:feature/phoenix-fs-retired-extents
