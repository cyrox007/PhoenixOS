[package]
name = "phoenixos-asus-acceptance-image"
version = "0.0.1"
edition = "2024"
publish = false

# Отдельный активный диагностический образ: обычный пассивный неизменен.
[build-dependencies]
phoenix-diagnostic-kernel = { path = "../../diagnostic-kernel", artifact = "bin", target = "x86_64-unknown-none", features = ["asus-acceptance"] }
bootloader = "=0.11.17"
