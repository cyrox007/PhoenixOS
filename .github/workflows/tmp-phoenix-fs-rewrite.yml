name: Временная проверка перезаписи PhoenixFS

on:
  push:
    branches:
      - feature/phoenix-fs-rewrite-file

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/phoenix-fs-rewrite-file
          fetch-depth: 0

      - name: Применить изменение
        shell: bash
        run: |
          python3 .github/tmp_phoenix_fs_rewrite.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/phoenix-fs/src/lib.rs')
          text = path.read_text()
          start = text.index('    fn phoenix_vfs_rewrites_existing_file_atomically() {')
          end = text.index('    #[test]', start + 1)
          fragment = text[start:end]
          fragment = fragment.replace(
              'MemoryBlockDevice::<512, 1024>::new()',
              'MemoryBlockDevice::<512, 128>::new()',
              1,
          )
          text = text[:start] + fragment + text[end:]
          path.write_text(text)
          PY

      - name: Привести код к формату
        run: cargo fmt --all

      - name: Проверить форматирование
        run: cargo fmt --all -- --check

      - name: Проверить PhoenixFS
        id: phoenixfs
        shell: bash
        run: |
          set +e
          cargo test -p phoenix-fs > .github/tmp_phoenix_fs_rewrite.log 2>&1
          code=$?
          cat .github/tmp_phoenix_fs_rewrite.log
          exit $code

      - name: Сохранить журнал проверки
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-fs-rewrite-log
          path: .github/tmp_phoenix_fs_rewrite.log
          if-no-files-found: ignore

      - name: Проверить ВФС
        if: success()
        run: cargo test -p phoenix-vfs

      - name: Зафиксировать результат
        if: success()
        shell: bash
        run: |
          rm -f .github/tmp_phoenix_fs_rewrite.py .github/workflows/tmp-phoenix-fs-rewrite.yml .github/tmp_phoenix_fs_rewrite.log Cargo.lock
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/phoenix-fs/src/lib.rs ROADMAP.md STATUS.md .github
          git diff --cached --quiet && exit 0
          git commit -m 'Добавить атомарную перезапись существующего файла PhoenixFS'
          git push origin HEAD:feature/phoenix-fs-rewrite-file
