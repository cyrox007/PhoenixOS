name: Временная реализация частичного усечения PhoenixFS

on:
  push:
    branches:
      - feature/phoenix-fs-partial-truncate

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Применить изменения
        run: python .github/tmp_partial_truncate_probe.py
      - name: Форматировать код
        run: cargo fmt --all
      - name: Проверить форматирование
        run: cargo fmt --all -- --check
      - name: Проверить PhoenixFS
        run: cargo test -p phoenix-fs
      - name: Проверить ВФС
        run: cargo test -p phoenix-vfs
      - name: Подготовить итоговый коммит
        run: |
          rm -f Cargo.lock
          rm -f .github/tmp_partial_truncate_probe.py
          rm -f .github/workflows/tmp-partial-truncate-probe.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/phoenix-fs/src/lib.rs ROADMAP.md STATUS.md .github
          git commit -m "Добавить частичное усечение файлов PhoenixFS"
          git push origin HEAD:feature/phoenix-fs-partial-truncate
