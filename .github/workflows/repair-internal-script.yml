name: Починка скрипта internal merge

on:
  push:
    branches:
      - feature/phoenix-fs-internal-merge-v1

permissions:
  contents: write

jobs:
  repair_script:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/phoenix-fs-internal-merge-v1
      - name: Исправить позиционный поиск
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/implement-internal-merge.yml')
          lines = p.read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if "hook_anchor =" in line)
          hook_line = next(i for i, line in enumerate(lines[start:], start) if "hook = r'''" in line)
          replacement = [
              "          hook_marker = '    let requested_blocks ='",
              "          function_start = s.index(anchor)",
              "          hook_position = s.index(hook_marker, function_start)",
          ]
          lines[start:hook_line] = replacement
          replace_index = next(i for i, line in enumerate(lines) if 's = s.replace(hook_end, hook + hook_end, 1)' in line)
          lines[replace_index] = "              s = s[:hook_position] + hook + s[hook_position:]"
          p.write_text('\n'.join(lines) + '\n')
          PY
      - name: Зафиксировать исправление
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/implement-internal-merge.yml
          git commit -m "Исправить позиционный поиск internal merge"
          git push origin HEAD:feature/phoenix-fs-internal-merge-v1
