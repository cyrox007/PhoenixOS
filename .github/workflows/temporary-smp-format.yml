name: Временное форматирование многоядерного кода

on:
  push:
    branches: [feat/342-kernel-ap-startup-qemu]
    paths: [.github/workflows/temporary-smp-format.yml]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Подготовить инструменты форматирования
        run: rustup show
      - name: Форматировать только изменённые пакеты
        run: cargo fmt --package kernel --package phoenix-acpi
      - name: Зафиксировать исправления форматирования
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kernel/src/main.rs kernel/src/acpi.rs kernel/src/arch/x86_64/mod.rs kernel/src/arch/x86_64/smp_probe.rs crates/acpi/src
          if ! git diff --cached --quiet; then
            git commit -m "Применить стандартное форматирование к многоядерной проверке"
            git push origin HEAD:feat/342-kernel-ap-startup-qemu
          fi
