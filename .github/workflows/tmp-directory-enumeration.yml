name: Временная реализация перечисления каталогов PhoenixFS

on:
  push:
    branches:
      - feature/phoenix-fs-directory-enumeration

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: Применить изменения
        run: python3 .github/tmp_directory_enumeration.py
      - name: Форматировать код
        run: cargo fmt --all
      - name: Проверить форматирование
        run: cargo fmt --all -- --check
      - name: Проверить ВФС
        run: cargo test -p phoenix-vfs
      - name: Проверить PhoenixFS
        run: cargo test -p phoenix-fs
      - name: Подготовить итоговый коммит
        run: |
          rm -f Cargo.lock
          rm -f .github/tmp_directory_enumeration.py .github/workflows/tmp-directory-enumeration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/vfs/src/lib.rs crates/phoenix-fs/src/lib.rs ROADMAP.md STATUS.md
          git add -u .github
          git commit -m "Добавить перечисление каталогов через ВФС"
          git push origin HEAD:feature/phoenix-fs-directory-enumeration
