name: Временная проверка раздельного резервирования PhoenixFS

on:
  push:
    branches:
      - feature/phoenix-fs-split-allocation

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/phoenix-fs-split-allocation
      - uses: dtolnay/rust-toolchain@nightly
      - name: Применить исправление
        run: python3 .github/tmp_split_allocation.py
      - name: Удалить временные файлы
        run: rm .github/tmp_split_allocation.py .github/workflows/tmp-split-allocation.yml
      - name: Форматировать код
        run: cargo fmt --all
      - name: Проверить форматирование
        run: cargo fmt --all -- --check
      - name: Проверить PhoenixFS
        run: cargo test -p phoenix-fs
      - name: Проверить ВФС
        run: cargo test -p phoenix-vfs
      - name: Подготовить итоговый коммит
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/phoenix-fs/src/lib.rs STATUS.md
          if git diff --cached --quiet; then
            echo "Изменений нет"
            exit 0
          fi
          git commit -m "Разделить резервирование данных и метаданных PhoenixFS"
          git push origin HEAD:feature/phoenix-fs-split-allocation
