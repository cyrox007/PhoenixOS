name: Исправить слияние под двухдочерним корнем

on:
  push:
    branches:
      - fix/phoenix-fs-two-child-root-internal-merge
    paths:
      - tools/apply-two-child-root-internal-merge.py
      - .github/workflows/apply-two-child-root-internal-merge.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/phoenix-fs-two-child-root-internal-merge
          fetch-depth: 0

      - name: Применить исправление
        run: python3 tools/apply-two-child-root-internal-merge.py

      - name: Отформатировать Rust
        run: cargo fmt --all

      - name: Проверить пакет PhoenixFS
        run: cargo test -p phoenix-fs

      - name: Удалить временные файлы применения
        run: |
          rm tools/apply-two-child-root-internal-merge.py
          rm .github/workflows/apply-two-child-root-internal-merge.yml
          rm -f Cargo.lock

      - name: Зафиксировать изменение
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Исправить слияние внутренних узлов под двухдочерним корнем"
          git push origin HEAD:fix/phoenix-fs-two-child-root-internal-merge
