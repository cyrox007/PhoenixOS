name: Временная реализация записи PhoenixFS

on:
  push:
    branches:
      - feature/phoenix-fs-empty-file-write

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/phoenix-fs-empty-file-write
          fetch-depth: 0

      - name: Применить изменение
        run: python3 .github/tmp_apply_phoenix_fs_write.py

      - name: Привести код к формату
        run: cargo fmt --all

      - name: Проверить форматирование
        run: cargo fmt --all -- --check

      - name: Проверить PhoenixFS
        run: cargo test -p phoenix-fs

      - name: Проверить ВФС
        run: cargo test -p phoenix-vfs

      - name: Зафиксировать результат
        run: |
          rm .github/tmp_apply_phoenix_fs_write.py
          rm .github/workflows/tmp-phoenix-fs-empty-write.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/phoenix-fs/src/lib.rs ROADMAP.md STATUS.md .github/tmp_apply_phoenix_fs_write.py .github/workflows/tmp-phoenix-fs-empty-write.yml
          git commit -m "Добавить атомарную запись в новый файл PhoenixFS"
          git push origin HEAD:feature/phoenix-fs-empty-file-write
