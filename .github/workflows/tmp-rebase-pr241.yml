name: Временная проверка частичной записи PhoenixFS

on:
  push:
    branches:
      - feature/phoenix-fs-partial-write
    paths:
      - .github/tmp_rebase_pr241.py
      - .github/workflows/tmp-rebase-pr241.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходники
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Установить Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Перенести изменения
        run: python3 .github/tmp_rebase_pr241.py

      - name: Отформатировать
        run: cargo fmt --all

      - name: Проверить форматирование
        run: cargo fmt --all -- --check

      - name: Проверить PhoenixFS
        run: cargo test -p phoenix-fs

      - name: Проверить общий VFS
        run: cargo test -p phoenix-vfs

      - name: Удалить временные файлы и зафиксировать результат
        run: |
          rm .github/tmp_rebase_pr241.py .github/workflows/tmp-rebase-pr241.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Перенести частичную запись PhoenixFS на текущий develop"
          git push
