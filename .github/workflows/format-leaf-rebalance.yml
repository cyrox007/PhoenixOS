name: Форматирование перераспределения PhoenixFS

on:
  push:
    branches:
      - feature/phoenix-fs-leaf-rebalance-v2

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/phoenix-fs-leaf-rebalance-v2
      - name: Выбрать инструментарий Rust
        run: rustup show
      - name: Применить rustfmt
        run: cargo fmt --all
      - name: Зафиксировать форматирование
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/phoenix-fs/src/lib.rs
          git commit -m "Исправить форматирование перераспределения PhoenixFS"
          git push origin HEAD:feature/phoenix-fs-leaf-rebalance-v2
