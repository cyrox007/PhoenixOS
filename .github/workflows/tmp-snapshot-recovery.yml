name: Временная проверка восстановления снимка PhoenixFS

on:
  push:
    branches:
      - feature/phoenix-fs-snapshot-recovery

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/phoenix-fs-snapshot-recovery
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@nightly

      - name: Применить исправление
        run: python3 .github/tmp_snapshot_recovery.py

      - name: Удалить временные файлы
        run: |
          rm .github/tmp_snapshot_recovery.py
          rm .github/workflows/tmp-snapshot-recovery.yml

      - name: Форматировать код
        run: cargo fmt --all

      - name: Проверить форматирование
        run: cargo fmt --all -- --check

      - name: Проверить PhoenixFS
        run: cargo test -p phoenix-fs

      - name: Проверить ВФС
        run: cargo test -p phoenix-vfs

      - name: Подготовить итоговый коммит
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Добавить восстановление предыдущего снимка PhoenixFS"
          git push origin HEAD:feature/phoenix-fs-snapshot-recovery
